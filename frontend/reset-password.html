<!DOCTYPE html>
<html>
<head>
  <title>Reset Password — Synora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">S</div>
      <h1>SYNORA</h1>
      <p>A connected space where people, ideas, and collaboration stay in sync.</p>
    </div>

    <h2>Enter code</h2>
    <p class="subtitle" id="emailNote">We sent a code to your email.</p>

    <div class="input-group">
      <span class="icon">&#128273;</span>
      <input id="otp" placeholder="6-digit code" maxlength="6">
    </div>
    <div class="input-group">
      <span class="icon">&#128274;</span>
      <input id="newPassword" placeholder="New password" type="password">
      <span class="toggle-eye" onclick="togglePassword('password', this)">&#128065;</span>
    </div>

    <button onclick="resetPassword()">Reset Password</button>
    <p class="error" id="error"></p>

    <div class="links">
      <a href="login.html">Back to login</a>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
