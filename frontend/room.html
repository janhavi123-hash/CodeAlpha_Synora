<!DOCTYPE html>
<html>
<head>
  <title>Meeting Room — Synora</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: block; padding: 20px; }
    .room-header { text-align: center; margin-bottom: 20px; }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
    }
    .video-tile {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 4/3;
    }
    .video-tile video { width: 100%; height: 100%; object-fit: cover; }
    .avatar-overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6a5cff, #00d4c9);
      font-size: 2.4rem; font-weight: 700; color: #fff;
    }
    .tile-label {
      position: absolute; bottom: 8px; left: 8px;
      background: rgba(0,0,0,0.55); color: #fff;
      font-size: 0.78rem; padding: 3px 9px; border-radius: 6px;
      display: flex; align-items: center; gap: 5px;
    }
    .mic-off-icon { width: 12px; height: 12px; color: #ff5c5c; }

    .controls {
      display: flex; justify-content: center; gap: 14px; margin-top: 20px;
    }
    .icon-btn {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.12); color: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn svg { width: 22px; height: 22px; }
    .icon-btn.end-call { background: #e53935; }
.icon-btn.end-call:hover { background: #c62828; }

    .main-layout { display: flex; gap: 20px; max-width: 1100px; margin: 0 auto; }
    .side-panel {
      width: 280px; background: rgba(255,255,255,0.05); border-radius: 12px;
      padding: 15px; display: flex; flex-direction: column; height: 500px;
    }
    .whiteboard-section { max-width: 1100px; margin: 20px auto 0; }

    @media (max-width: 800px) {
      .main-layout { flex-direction: column; }
      .side-panel { width: 100%; height: 320px; }
    }
  </style>
</head>
<body>
  <div class="room-header">
    <h2 id="roomTitle">Room</h2>
  </div>

  <div class="main-layout">
    <div style="flex: 1;">
      <div class="video-grid" id="videoGrid">
        <div class="video-tile" id="tile-local">
          <video id="localVideo" autoplay muted playsinline></video>
          <div class="avatar-overlay" id="avatar-local"></div>
          <div class="tile-label" id="label-local">You</div>
        </div>
      </div>
    </div>

    <div class="side-panel">
      <h3 style="margin-bottom: 10px;">Chat & Files</h3>
      <div id="chatMessages" style="flex: 1; overflow-y: auto; margin-bottom: 10px; font-size: 0.85rem;"></div>

      <input type="file" id="fileInput" style="margin-bottom: 8px; font-size: 0.8rem;">
      <button id="sendFileBtn" style="margin-bottom: 10px;">Send File</button>

      <div style="display: flex; gap: 6px;">
        <input id="chatInput" placeholder="Type a message" style="flex: 1; padding: 8px; border-radius: 6px; border: none;">
        <button id="sendChatBtn" style="width: auto; padding: 8px 14px;">Send</button>
      </div>
    </div>
  </div>

  <div class="whiteboard-section">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h3>Whiteboard</h3>
      <div style="display: flex; gap: 8px; align-items: center;">
        <input type="color" id="penColor" value="#00ffcc" style="width: 36px; height: 32px; border: none; border-radius: 6px; cursor: pointer;">
        <button id="eraserBtn" style="width: auto; padding: 8px 14px;">Eraser</button>
        <button id="clearBoardBtn" style="width: auto; padding: 8px 14px;">Clear</button>
      </div>
    </div>
    <canvas id="whiteboard" width="1060" height="400" style="background: #fff; border-radius: 12px; cursor: crosshair; touch-action: none; width: 100%; display: block;"></canvas>
  </div>

  <div class="controls">
    <button class="icon-btn" id="muteBtn" title="Mute">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button class="icon-btn" id="videoBtn" title="Camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
    </button>
    <button class="icon-btn" id="shareScreenBtn" title="Share screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
    <button class="icon-btn end-call" id="endCallBtn" title="End call">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5c-1.2 0-2.4-.2-3.6-.6-.4-.1-.8 0-1 .3l-1.7 2.1c-2.7-1.3-5.1-3.6-6.4-6.4l2.1-1.7c.3-.3.4-.7.3-1-.4-1.1-.6-2.3-.6-3.6 0-.6-.4-1-1-1H4.5c-.6 0-1 .4-1 1C3.5 14.1 9.9 20.5 18 20.5c.6 0 1-.4 1-1V16.5c0-.6-.4-1-1-1z"/></svg>
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
