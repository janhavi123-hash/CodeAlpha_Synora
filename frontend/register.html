<!DOCTYPE html>
<html>
<head>
  <title>Sign Up — Synora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">S</div>
      <h1>SYNORA</h1>
      <p>A connected space where people, ideas, and collaboration stay in sync.</p>
    </div>

    <h2>Create your account</h2>
    <p class="subtitle">Sign up to start collaborating.</p>

    <div class="input-group">
      <span class="icon">&#128100;</span>
      <input id="name" placeholder="Full Name">
    </div>
    <div class="input-group">
      <span class="icon">&#9993;</span>
      <input id="email" placeholder="Email" type="email">
    </div>
    <div class="input-group">
      <span class="icon">&#128274;</span>
      <input id="password" placeholder="Password" type="password">
      <span class="toggle-eye" onclick="togglePassword('password', this)">&#128065;</span>
    </div>

    <button onclick="registerUser()">Sign Up</button>
    <p class="error" id="error"></p>

    <div class="links">
      <span></span>
      <a href="login.html">Already have an account?</a>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
