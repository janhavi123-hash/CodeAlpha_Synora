<!DOCTYPE html>
<html>
<head>
  <title>Ready to join — Synora</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { display: block; padding: 20px; }
    .lobby-wrap { max-width: 480px; margin: 60px auto; text-align: center; }
    .preview-box {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #000; border-radius: 14px; overflow: hidden; margin-bottom: 20px;
    }
    .preview-box video { width: 100%; height: 100%; object-fit: cover; }
    .avatar-overlay {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6a5cff, #00d4c9);
      font-size: 3rem; font-weight: 700; color: #fff;
    }
    .icon-btn-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 24px; }
    .icon-btn {
      width: 52px; height: 52px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.1); color: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .icon-btn svg { width: 22px; height: 22px; }
    .icon-btn.off { background: #ff5c5c; }
    .join-btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #6a5cff, #00d4c9);
      color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="lobby-wrap">
    <h2>Ready to join?</h2>
    <p class="subtitle" id="roomLabel" style="margin-bottom: 16px;"></p>

    <div class="preview-box">
      <video id="previewVideo" autoplay muted playsinline></video>
      <div class="avatar-overlay" id="avatarOverlay"></div>
    </div>

    <div class="icon-btn-row">
      <button class="icon-btn" id="micToggle" title="Toggle mic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <button class="icon-btn" id="camToggle" title="Toggle camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
      </button>
    </div>

    <button class="join-btn" id="joinBtn">Join Now</button>
  </div>
  <script src="js/lobby.js"></script>
</body>
</html>
