<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password — Synora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">S</div>
      <h1>SYNORA</h1>
      <p>A connected space where people, ideas, and collaboration stay in sync.</p>
    </div>

    <h2>Reset your password</h2>
    <p class="subtitle">Enter your email to receive a verification code.</p>

    <div class="input-group">
      <span class="icon">&#9993;</span>
      <input id="email" placeholder="Email" type="email">
    </div>

    <button onclick="sendResetCode()">Send Code</button>
    <p class="error" id="error"></p>

    <div class="links">
      <a href="login.html">Back to login</a>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
